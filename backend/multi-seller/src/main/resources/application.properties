spring.application.name=multi-seller-marketplace

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/marketplace}
spring.datasource.username=${DATABASE_USERNAME:marketplace}
spring.datasource.password=${DATABASE_PASSWORD:marketplace}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
